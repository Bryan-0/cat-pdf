<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: http://127.0.0.1:*; connect-src http://127.0.0.1:*; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Cat PDF</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-logo" id="brand-logo" aria-hidden="true"></span>
        <span class="brand-name">Cat <b>PDF</b></span>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item" data-view="home" type="button"><span class="nav-icon" data-icon="home"></span><span>Home</span></button>
        <button class="nav-item" data-view="merge" type="button"><span class="nav-icon" data-icon="merge"></span><span>Merge</span></button>
        <button class="nav-item" data-view="editor" type="button"><span class="nav-icon" data-icon="edit"></span><span>Edit &amp; sign</span></button>
        <button class="nav-item" data-view="convert" type="button"><span class="nav-icon" data-icon="convert"></span><span>Convert</span></button>
        <button class="nav-item" data-view="markdown" type="button"><span class="nav-icon" data-icon="markdown"></span><span>PDF → Markdown</span></button>
      </nav>
      <div class="sidebar-foot">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
          <span class="theme-icon" aria-hidden="true"></span><span class="theme-label">Dark mode</span>
        </button>
        <div class="sidebar-note">100% local · nothing leaves your computer</div>
        <div class="sidebar-cat" id="sidebar-cat" aria-hidden="true"></div>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div id="splash" class="splash" hidden></div>
  <div id="loader" class="loader" hidden aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
