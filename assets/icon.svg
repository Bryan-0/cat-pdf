  <path d="M256 354 Q256 374 234 376 M256 354 Q256 374 278 376" fill="none" stroke="#3B2A1E" stroke-width="7" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#3B2A1E" stroke-width="5" stroke-linecap="round">
    <line x1="168" y1="352" x2="96" y2="340"/>
    <line x1="168" y1="368" x2="98" y2="376"/>
    <line x1="344" y1="352" x2="416" y2="340"/>
