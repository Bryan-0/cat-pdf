  <!-- ears -->
  <path d="M120 250 L150 120 L232 196 Z" fill="#E8761A"/>
  <path d="M392 250 L362 120 L280 196 Z" fill="#E8761A"/>
  <path d="M146 220 L160 160 L204 200 Z" fill="#FFC9A3"/>
  <path d="M366 220 L352 160 L308 200 Z" fill="#FFC9A3"/>
